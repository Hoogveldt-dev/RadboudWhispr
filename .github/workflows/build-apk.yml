# Builds an unsigned release APK. Signing happens outside GitHub with release.jks,
# so the key never has to be stored here. apksigner.jar is uploaded alongside for that.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests and release build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Collect APK and apksigner
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          cp "$BT/lib/apksigner.jar" out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: out/
