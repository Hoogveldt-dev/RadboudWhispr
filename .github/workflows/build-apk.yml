# Builds an unsigned release APK. Signing happens outside GitHub with release.jks,
# so the key never has to be stored here. apksigner.jar is shipped alongside for that.
# The files are uploaded as an artifact and also pushed to the apk-build branch, for
# machines that can reach GitHub over git but not the artifact storage.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']  # documentation-only commits need no new APK

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests and release build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Collect APK and apksigner
        run: |
          mkdir out
          cp app/build/outputs/apk/release/*.apk out/
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          cp "$BT/lib/apksigner.jar" out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: out/
      - name: Publish to apk-build branch
        run: |
          cd out
          git init -q -b apk-build
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "APK build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
